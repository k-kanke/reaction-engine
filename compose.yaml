services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: reaction
      POSTGRES_PASSWORD: reaction
      POSTGRES_DB: reaction
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
    env_file:
      - ./backend/.env.local
    environment:
      GATEWAY_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis

  media-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE: media-api
    env_file:
      - ./backend/.env.local
    environment:
      MEDIA_API_PORT: 8081
    ports:
      - "8081:8081"
    volumes:
      - ./tmp/media:/var/reaction/media
      - ./backend/.secrets:/var/reaction/secrets:ro
    depends_on:
      - postgres
      - redis

  writer:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE: writer
    env_file:
      - ./backend/.env.local
    volumes:
      - ./tmp/jsonl:/var/reaction/jsonl
    depends_on:
      - postgres

  image-analysis-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE: image-analysis-worker
    env_file:
      - ./backend/.env.local
    volumes:
      - ./tmp/media:/var/reaction/media
      - ./backend/.secrets:/var/reaction/secrets:ro
    depends_on:
      - postgres
      - redis

  migrate:
    image: migrate/migrate:v4.17.1
    profiles:
      - tools
    volumes:
      - ./backend/migrations:/migrations
    depends_on:
      - postgres
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://reaction:reaction@postgres:5432/reaction?sslmode=disable

  tbls:
    image: ghcr.io/k1low/tbls:v1.79.4
    profiles:
      - tools
    working_dir: /work
    volumes:
      - .:/work
    depends_on:
      - postgres
    entrypoint:
      - tbls
      - doc
      - --config
      - /work/.tbls.yml
      - --force

volumes:
  postgres-data:
