name: Deploy writer

on:
  push:
    branches:
      - main
    paths:
      - backend/Dockerfile
      - backend/go.mod
      - backend/go.sum
      - backend/cmd/writer/**
      - backend/internal/contract/**
      - backend/internal/db/**
      - backend/internal/writer/**
      - infra/**
      - .github/workflows/deploy-writer.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: reaction-engine-501316
  REGION: asia-northeast1
  SERVICE: writer
  TF_VAR_project_id: reaction-engine-501316
  TF_VAR_region: asia-northeast1
  TF_VAR_media_bucket_name: ${{ vars.MEDIA_BUCKET_NAME }}
  TF_VAR_jsonl_bucket_name: ${{ vars.JSONL_BUCKET_NAME }}
  TF_VAR_terraform_state_bucket_name: ${{ vars.TERRAFORM_STATE_BUCKET_NAME }}
  TF_VAR_media_api_invoker_members: ${{ vars.MEDIA_API_INVOKER_MEMBERS_JSON }}
  TF_VAR_gmail_sender_from: ${{ vars.GMAIL_SENDER_FROM }}
  TF_VAR_gmail_oauth_client_id: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
  TF_VAR_gmail_oauth_client_secret: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
  TF_VAR_gmail_oauth_refresh_token: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}

jobs:
  deploy:
    name: Build and deploy r-writer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Compute image tag
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: infra/environments/prod
        run: terraform init -input=false

      - name: Read current media-api image tag
        id: media-api
        working-directory: infra/environments/prod
        run: |
          tag="$(
            terraform state show module.media_api_service.google_cloud_run_v2_service.this \
              | sed -nE 's/.*image[[:space:]]*=[[:space:]]*"[^"]*\/media-api:([^"]+)".*/\1/p' \
              | head -n 1
          )"
          if [ -z "$tag" ]; then
            echo "Failed to read current media-api image tag from Terraform state" >&2
            exit 1
          fi
          echo "MEDIA_API_IMAGE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Read current gateway image tag
        id: gateway
        working-directory: infra/environments/prod
        run: |
          tag="$(
            terraform state show module.gateway_service.google_cloud_run_v2_service.this \
              | sed -nE 's/.*image[[:space:]]*=[[:space:]]*"[^"]*\/gateway:([^"]+)".*/\1/p' \
              | head -n 1
          )"
          if [ -z "$tag" ]; then
            echo "Failed to read current gateway image tag from Terraform state" >&2
            exit 1
          fi
          echo "GATEWAY_IMAGE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Read current image-analysis-worker image tag
        id: image-analysis-worker
        working-directory: infra/environments/prod
        run: |
          tag="$(
            terraform state show module.image_analysis_worker_service.google_cloud_run_v2_service.this \
              | sed -nE 's/.*image[[:space:]]*=[[:space:]]*"[^"]*\/image-analysis-worker:([^"]+)".*/\1/p' \
              | head -n 1
          )"
          if [ -z "$tag" ]; then
            echo "Failed to read current image-analysis-worker image tag from Terraform state" >&2
            exit 1
          fi
          echo "IMAGE_ANALYSIS_WORKER_IMAGE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Read current post-session-job image tag
        id: post-session-job
        working-directory: infra/environments/prod
        run: |
          tag="$(
            terraform state show module.post_session_job.google_cloud_run_v2_job.this \
              | sed -nE 's/.*image[[:space:]]*=[[:space:]]*"[^"]*\/post-session-job:([^"]+)".*/\1/p' \
              | head -n 1
          )"
          if [ -z "$tag" ]; then
            echo "Failed to read current post-session-job image tag from Terraform state" >&2
            exit 1
          fi
          echo "POST_SESSION_JOB_IMAGE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Read current pdf-renderer image tag
        id: pdf-renderer
        working-directory: infra/environments/prod
        run: |
          tag="$(
            terraform state show module.pdf_renderer_job.google_cloud_run_v2_job.this \
              | sed -nE 's/.*image[[:space:]]*=[[:space:]]*"[^"]*\/pdf-renderer:([^"]+)".*/\1/p' \
              | head -n 1
          )"
          if [ -z "$tag" ]; then
            echo "Failed to read current pdf-renderer image tag from Terraform state" >&2
            exit 1
          fi
          echo "PDF_RENDERER_IMAGE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Read current gmail-sender image tag
        id: gmail-sender
        working-directory: infra/environments/prod
        run: |
          tag="$(
            terraform state show module.gmail_sender_job.google_cloud_run_v2_job.this \
              | sed -nE 's/.*image[[:space:]]*=[[:space:]]*"[^"]*\/gmail-sender:([^"]+)".*/\1/p' \
              | head -n 1
          )"
          if [ -z "$tag" ]; then
            echo "Failed to read current gmail-sender image tag from Terraform state" >&2
            exit 1
          fi
          echo "GMAIL_SENDER_IMAGE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Build and push writer image
        run: |
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/reaction-engine-backend/${SERVICE}:${TAG}"
          cat > /tmp/cloudbuild-writer.yaml <<EOF
          steps:
            - name: 'gcr.io/cloud-builders/docker'
              args: ['build', '--platform', 'linux/amd64', '--build-arg', 'SERVICE=${SERVICE}', '-t', '${image}', '-f', 'backend/Dockerfile', 'backend']
          images: ['${image}']
          EOF
          submit_output="$(
            gcloud builds submit \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --async \
            --config=/tmp/cloudbuild-writer.yaml \
            . 2>&1
          )"
          echo "$submit_output"

          build_id="$(
            printf '%s\n' "$submit_output" \
              | sed -nE 's|.*builds/([0-9a-f-]+).*|\1|p' \
              | tail -n 1
          )"
          if [ -z "$build_id" ]; then
            echo "Failed to parse Cloud Build ID" >&2
            exit 1
          fi

          while true; do
            status="$(
              gcloud builds describe "$build_id" \
                --project="${PROJECT_ID}" \
                --region="${REGION}" \
                --format='value(status)'
            )"
            echo "Cloud Build ${build_id}: ${status}"
            case "$status" in
              SUCCESS)
                break
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                exit 1
                ;;
            esac
            sleep 5
          done

      - name: Deploy writer with Terraform
        working-directory: infra/environments/prod
        run: |
          terraform apply -input=false -auto-approve -lock-timeout=5m \
            -var="writer_image_tag=${TAG}" \
            -var="media_api_image_tag=${MEDIA_API_IMAGE_TAG}" \
            -var="gateway_image_tag=${GATEWAY_IMAGE_TAG}" \
            -var="image_analysis_worker_image_tag=${IMAGE_ANALYSIS_WORKER_IMAGE_TAG}" \
            -var="post_session_job_image_tag=${POST_SESSION_JOB_IMAGE_TAG}" \
            -var="pdf_renderer_image_tag=${PDF_RENDERER_IMAGE_TAG}" \
            -var="gmail_sender_image_tag=${GMAIL_SENDER_IMAGE_TAG}"
