<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reaction Engine</title>
    <link rel="stylesheet" href="./sidebar.css">
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div>
          <h1>Reaction Engine</h1>
          <p>Google Meet realtime reaction sidebar</p>
        </div>
        <span id="statusBadge" class="badge">Idle</span>
      </header>

      <section class="section">
        <label for="wsUrl">WebSocket URL</label>
        <div class="row">
          <input id="wsUrl" type="url" placeholder="ws://localhost:8787/realtime">
          <button id="connectButton" type="button">Connect</button>
        </div>
        <p class="hint">未設定でもローカル解析とログ表示は動きます。</p>
      </section>

      <section class="section">
        <div class="metrics">
          <div>
            <span class="metric-label">Session</span>
            <strong id="sessionId">-</strong>
          </div>
          <div>
            <span class="metric-label">Faces</span>
            <strong id="faceCount">0</strong>
          </div>
          <div>
            <span class="metric-label">Motion</span>
            <strong id="motionScore">0.00</strong>
          </div>
          <div>
            <span class="metric-label">Attention</span>
            <strong id="attentionScore">0.00</strong>
          </div>
        </div>
      </section>

      <section class="section">
        <canvas id="preview" width="640" height="360"></canvas>
        <video id="sourceVideo" autoplay muted playsinline></video>
      </section>

      <section class="section controls">
        <button id="startButton" type="button" class="primary">Start Capture</button>
        <button id="stopButton" type="button" disabled>Stop</button>
        <button id="micPermButton" type="button">🎤 マイクを許可</button>
      </section>

      <section class="section">
        <label for="videoFile">録画ファイルを解析</label>
        <div class="row">
          <input id="videoFile" type="file" accept="video/*">
        </div>
        <div class="upload-controls row" style="display:none">
          <button id="uploadPlayButton" type="button" class="primary">再生 &amp; 解析</button>
          <button id="uploadStopButton" type="button" disabled>停止</button>
        </div>
      </section>

      <section class="section">
        <h2>Feature Events</h2>
        <ol id="eventLog" class="event-log"></ol>
      </section>
    </main>

    <script src="./sidebar.js" type="module"></script>
  </body>
</html>
